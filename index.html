<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Happy Birthday</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.18.2/TweenMax.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.0.0-beta1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ScrollMagic/2.0.5/ScrollMagic.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ScrollMagic/2.0.5/plugins/animation.gsap.js"></script>

    <style>
        /* GÖNDERDİĞİN CSS KODLARI */
        html { font-family: sans-serif; -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100% }
        body { margin: 0; padding: 0; background: #E9E8E4; font-size: 20px; font-family: sans-serif; color: #1d1d1b }
        .scenes { position: relative; margin: 0 auto; width: 100% }
        .items { width: 100%; position: absolute; top: 0; left: 0; height: 100% }
        .overflow { width: 100%; overflow: hidden; position: relative }
        .scene { margin-top: -2px; width: 100%; height: 768px; position: relative; z-index: 10; background-size: auto 768px; }
        .scene-1 { height: 1828px; background: url(http://asmitashinde.com/projects/css/images/birthday//scene-1.svg) 50% -100px repeat-x; background-size: 1920px auto; }
        .scene-2 { background-image: url(http://asmitashinde.com/projects/css/images/birthday//scene-2.svg) }
        .scene-3 { background-image: url(http://asmitashinde.com/projects/css/images/birthday//scene-3.svg) }
        .scene-4 { background-image: url(http://asmitashinde.com/projects/css/images/birthday//scene-4.svg) }
        .scene-5 { background-image: url(http://asmitashinde.com/projects/css/images/birthday//scene-5.svg) }
        .scene-6 { background-image: url(http://asmitashinde.com/projects/css/images/birthday//scene-6.svg); height: 1100px; }
        
        /* Buraya diğer gönderdiğin tüm CSS'leri ekleyebilirsin */
        .egg, .egg-2 { width: 84px; height: 108px; top: 540px; position: relative; margin: 0 auto; background: url(http://asmitashinde.com/projects/css/images/birthday//egg.svg) no-repeat; background-size: 100% auto; z-index: 20; }
        .hide { visibility: hidden; }
        .text { margin: 0 auto; width: 280px; text-align: center; color: white; }
    </style>
</head>
<body>

    <div class="overflow">
        <div class="scenes">
            <div class="items">
                <div class="egg"></div>
                <div class="egg-2 hide"></div>
                </div>
            
            <section class="scene scene-1">
                <div class="text">
                    <p class="intro">
                        <span class="intro1">OMG!!!</span><br>
                        <span class="intro1">It's your <b>Birthday!</b></span>
                    </p>
                </div>
            </section>
            
            </div>
    </div>

    <script src="http://asmitashinde.com/projects/js/birthday/ScrollMagic.js"></script>
    <script src="http://asmitashinde.com/projects/js/birthday/birthday.js"></script>

    <script>
        // Tarihi otomatik güncellemek için:
        const d = new Date();
        if(document.getElementById('date')) {
            document.getElementById('date').innerHTML = d.getDate() + "/" + (d.getMonth()+1);
        }
    </script>
</body>
</html>
