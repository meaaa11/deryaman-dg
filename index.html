<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İyi ki Doğdun Deryaman!</title>
    <link href="https://fonts.googleapis.com/css?family=Raleway:100,200,300,400,500,600,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Pacifico" rel="stylesheet">
    
    <style>
        /* --- GENEL STİLLER --- */
        body { background-color: #f7e4ed; margin: 0; overflow: hidden; font-family: 'Raleway', sans-serif; }
        .container { width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; }

        /* --- EDUARDO MORENO: PASTA VE MUMLAR --- */
        .cake { position: relative; width: 250px; height: 200px; z-index: 10; cursor: pointer; transition: all 1s ease; }
        .plate { width: 270px; height: 110px; position: absolute; bottom: -10px; left: -10px; background-color: #ccc; border-radius: 50%; box-shadow: 0 5px 40px rgba(0,0,0,0.3); }
        .layer { position: absolute; width: 250px; height: 100px; border-radius: 50%; background-color: #553c13; }
        .layer-top { top: 0px; } .layer-middle { top: 33px; } .layer-bottom { top: 66px; }
        .icing { top: 2px; left: 5px; background-color: #f0e4d0; width: 240px; height: 90px; border-radius: 50%; position: absolute; z-index: 1; }
        .drip { display: block; width: 50px; height: 60px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; background-color: #f0e4d0; position: absolute; }
        .drip1 { top: 53px; left: 5px; transform: skewY(15deg); width: 40px; }
        .drip2 { top: 69px; left: 181px; transform: skewY(-15deg); }
        .drip3 { top: 54px; left: 90px; width: 80px; }

        .candle { background-color: #7B5292; width: 16px; height: 50px; border-radius: 8px / 4px; position: absolute; z-index: 10; }
        .flame { position: absolute; background-color: orange; width: 15px; height: 35px; border-radius: 50% 50% 20% 20%; top: -34px; left: 50%; margin-left: -7.5px; animation: flicker 1s infinite; }
        @keyframes flicker { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1) rotate(2deg); } }

        /* --- ELIZABETH RUDAYA: KALPLİ KEDİ --- */
        #cat-wrapper {
            position: absolute;
            top: -220px;
            left: 50%;
            transform: translateX(-50%);
            display: none; /* Başlangıçta gizli, tıklayınca çıkacak */
        }
        .cat { position: relative; width: 150px; height: 110px; background: #e0e0e0; border-radius: 100px 100px 60px 60px; border: 4px solid #333; }
        .cat:after { content: '❤️'; position: absolute; top: -45px; left: 40%; font-size: 35px; animation: heartBeat 0.8s infinite alternate; }
        .eye { width: 10px; height: 10px; background: #333; border-radius: 50%; position: absolute; top: 40px; }
        .eye-l { left: 40px; } .eye-r { right: 40px; }
        .ear { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 30px solid #e0e0e0; position: absolute; top: -20px; }
        .ear-l { left: 10px; transform: rotate(-15deg); } .ear-r { right: 10px; transform: rotate(15deg); }
        @keyframes heartBeat { to { transform: scale(1.3); } }

        /* --- METİN VE SURPRIZ --- */
        .text-box { position: absolute; bottom: 5%; text-align: center; width: 100%; opacity: 0; transition: all 1s ease; }
        .text-box.show { opacity: 1; bottom: 15%; }
        .main-title { font-family: 'Pacifico', cursive; font-size: 4rem; color: #ad1457; margin: 0; }
        
        #video-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="video-background"></div>

        <div class="cake" id="cake-trigger">
            <div id="cat-wrapper">
                <div class="cat">
                    <div class="ear ear-l"></div>
                    <div class="ear ear-r"></div>
                    <div class="eye eye-l"></div>
                    <div class="eye eye-r"></div>
                </div>
            </div>

            <div class="plate"></div>
            <div class="layer layer-bottom"></div>
            <div class="layer layer-middle"></div>
            <div class="layer layer-top"></div>
            <div class="icing"></div>
            <div class="drip drip1"></div>
            <div class="drip drip2"></div>
            <div class="drip drip3"></div>
            
            <div class="candle" style="left: 20%; top: -20px;"><div class="flame"></div></div>
            <div class="candle" style="left: 50%; top: -40px;"><div class="flame"></div></div>
            <div class="candle" style="left: 80%; top: -20px;"><div class="flame"></div></div>
        </div>

        <div class="text-box" id="msg-box">
            <h1 class="main-title">İyi ki Doğdun Deryaman!</h1>
            <p style="font-size: 1.5rem; color: #d81b60;">Gülüşün dünyayı aydınlatsın... ❤️</p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('video-background', {
                videoId: 'fLexgOxsZu0', // BURAYI DEĞİŞTİR: YouTube video ID'si
                playerVars: {
                    'autoplay': 1, 'controls': 0, 'showinfo': 0, 'modestbranding': 1,
                    'loop': 1, 'playlist': 'fLexgOxsZu0', 'fs': 0, 'autohide': 0
                },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) {
            event.target.mute();
            event.target.playVideo();
        }

        // Tıklama Etkileşimi
        $('#cake-trigger').click(function() {
            $(this).css('transform', 'translateY(50px) scale(0.9)');
            $('#cat-wrapper').fadeIn(1000); 
            $('#msg-box').addClass('show');
            player.unMute(); // Müzik başlar
        });
    </script>
</body>
</html>
